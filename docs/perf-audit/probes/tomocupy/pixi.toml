# Build tools the examples environment lacks. Only swig and the cuFFT headers are
# taken from here; the compiler, Python and libcufft.so come from the examples environment.
[workspace]
name = "tomocupy-spike-tools"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.9"

[dependencies]
swig = ">=4.3"
cuda-version = "12.9.*"
libcufft-dev = "*"
